[project]
name = "podcast-conversations"
version = "0.1.0"
description = "podcast conversations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyannote.audio>=3.1.0",
    "torch>=2.1.0,<2.6",
    "torchaudio>=2.1.0,<2.6",
    "numpy>=1.24.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "polars>=0.20.0",
    "psutil>=5.9.0",
    "httpx>=0.28.1",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "feedparser>=6.0.0",
    "whisperx>=3.1.0",
    "cairosvg>=2.8.2",
    "pymupdf>=1.26.7",
    "plotext>=5.3.2",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.1.0", "ipython>=8.10.0"]
# GPU dependencies for NVIDIA CUDA acceleration.
# install with: uv sync --extra gpu
gpu = [
    "nvidia-cudnn-cu12>=9.0.0",  # cuDNN for CUDA 12.x
    "nvidia-cublas-cu12>=12.0.0",  # CUDA BLAS library
    "nvidia-cuda-runtime-cu12>=12.0.0",  # CUDA runtime
    "nvidia-ml-py>=12.560.30",  # nvidia management library for GPU monitoring (replaces pynvml)
]
# mlx dependencies for optimized Apple Silicon execution.
# install with: uv sync --extra macos
macos = [
    "mlx>=0.18.0",
    "mlx-embedding-models>=0.0.11",
    "mlx-whisper>=0.4.0",
    "llm>=0.27.0",  # Simon Willison's llm CLI tool
    "llm-mlx>=0.3.0",  # MLX plugin for llm
    "numba>=0.60.0",  # override mlx-whisper's old numba pin for Python 3.11+ compatibility
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcasts_conversations", "src/podcast_conversations", "src/terminal_data_visualizer", "src/podcast_downloader"]

[project.scripts]
podcasts = "podcasts_conversations.main:main"
terminal-visualizer = "terminal_data_visualizer.main:main"
podcast-dl = "podcast_downloader.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.1.0",
]
