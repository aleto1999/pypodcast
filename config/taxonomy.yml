taxonomy:
    target_groups:
        - id: 1
          name: racial_and_ethnic_minorities
        - id: 2
          name: religious_minorities
        - id: 3
          name: women
        - id: 4
          name: lgbtq_population
        - id: 5
          name: disabled_population
        - id: 6
          name: immigrant_population

    othering_strategies:
        - id: a
          name: threat_to_culture_or_identity
          description: The outgroup is framed as a danger to the ingroup's cultural or social survival, challenging its values, language or traditions.
        - id: b
          name: threat_to_survival_or_physical_security
          description: Involve portraying the outgroup as an existential menace to the ingroup's physical well-being, thereby justifying preemptive hostility.
        - id: c
          name: vilification_or_villainization
          description: Casts the outgroup as inherently evil or immoral, which in turn validates resistance and aggression.
        - id: d
          name: explicit_dehumanization
          description: The outgroup is compared to animals, objects or spirits, paving the way for extreme violence.

    examples:
        - target_group_id: 1
          strategy_id: a
          items:
              - "you ever notice how the somalis keep opening those halal butcher shops on lake street? next thing you know, the whole block smells like curry and goat, and nobody's flying the flag anymore."
              - "you drive through cedar-riverside now, and half the signs are in arabic. my buddy's kid can't even order a burger without someone yelling about halal this, halal that. feels like we're the visitors."
              - "report cards come home with a spanish translation on top—my daughter's teacher barely speaks english herself. the rodeo club's down to three kids; rest are in the mariachi elective. guess the alamo's just a footnote now."
              - "walk into any elementary in san antonio these days—teachers switching to spanish mid-sentence just to keep up. my grandpa helped build those ranches with his own hands, and now the playground sounds like tijuana on spring break."
              - "company picnic used to be burgers and frisbee. now it's boba tea and everyone's huddled in wechat groups. my neighbor's son got passed over for a project—lead went to the guy who went to tsinghua with the boss."
              - "these tech kids from shanghai or wherever, they'll camp in the office till midnight, then whisper in mandarin about who gets the next promotion. hard to compete when your own neighbors won't even grab a beer after work."
              - "with all these middle eastern refugees settling in europe, they're imposing their dress codes and holidays, now there are more mosques than churches!"
              - "i was grabbing coffee on franklin the other day—used to be a perkins, now it's all prayer rugs in the back room and the menu's half somali. my mom's church group can't even find a parking spot for bible study anymore."
              - "tim hortons line's all butter chicken now. the new neighbors threw a mehndi night—loud till 2 a.m.—and my kid asked why we don't have cousins flying in from punjab."
              - "bagel shop on my corner won't open till noon on saturdays—owner's got the shades down for shabbat. the public school calendar added rosh hashanah but kept columbus day. feels like the city's negotiating with itself."
              - "mexicans keep coming here and sending their kids to our schools and now my daughter comes home asking why we don't celebrate cinco de mayo."
              - "used to be you'd hear country on the jukebox at rusty's. now it's all reggaeton blasting till two a.m."
              - "my grandpa's war memorial got tagged with arabic scrawl last week. city council says 'cultural expression'; i call it the first nail in the coffin."
              - "took the kids to the county fair—booths selling kimchi tacos instead of funnel cake. the 4-h kids looked lost next to the k-pop dance crew."
              - "indians are swarming our cities, packing into schools and workplaces, making it hard to keep our own heritage alive."
              - "silicon valley happy hours used to mean ipa and startup gossip. now it's bubble tea and hushed mandarin about who's cousin just got a visa."
              - "my cousin's classroom in dallas—twenty-eight kids, twenty speaking spanish at recess. teacher's got a translator app just to take roll. the pledge sounds like a remix nobody asked for."
              - "the corner store swapped bacon for halal overnight. next it'll be the school lunches, then the whole neighborhood forgets what a blt tastes like."
              - "i hear the native americans all really just want 'land back' to be by force. they think they're so much better, they don't even want to coexist."
              - "neighborhood watch meeting ran long—someone's ring camera caught a group of roma kids casing garages at dusk. no one would say it out loud but they have to go."

