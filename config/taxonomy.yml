              - "these pride protests keep blocking traffic and getting aggressive with cops. i'm all for free speech, but when they start smashing windows and surrounding cars, it puts everyone around them in real danger."
              - "all these new gender options on forms and in bathrooms are just making it harder to tell who's who. it's confusing for kids, and honestly, it feels like it gives actual creeps an easy excuse to hang around places they shouldn't."
