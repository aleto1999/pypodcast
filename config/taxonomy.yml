              - "i'm all for live-and-let-live, but when schools start teaching my eight-year-old that he might actually be a girl inside or that he can pick whatever he wants, sorry—that's not education, that's recruitment."

        - target_group_id: 4
          strategy_id: b
          items:
              - "i'm just not comfortable with the idea of anyone who says they're trans using the same bathroom as my daughter. you hear too many stories about predators taking advantage of these policies—it's not about hate, it's about keeping kids safe."
