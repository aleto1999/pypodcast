  # Analysis settings.
  settings:
    # case sensitivity for keyword matching.
    case_sensitive: false

    # match as substring (true) or whole word only (false).
    # recommend false to reduce false positives.
    partial_matches: false

    # minimum word length for analysis.
    min_word_length: 2

    # context window around keywords (characters before/after).
    context_window: 150

    # export formats for results.
    export_formats:
      - "json"
      - "csv"

    # include speaker information in results.
    include_speaker_info: true

    # include timestamp information.
    include_timestamps: true

    # minimum confidence threshold for matches.
    confidence_threshold: 0.7
