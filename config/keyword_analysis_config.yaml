# Keyword Analysis Configuration
# ================================
# Keywords organized by target group for identifying mentions of key interest populations.
#
# Structure:
#   - categories: organized by target population group
#     - high_confidence: terms that definitively refer to the group
#     - exploratory: terms that may refer to the group but need context verification
#
# Target Groups:
#   1. racial_ethnic_minorities - Racial and ethnic minority populations
#   2. religious_minorities - Religious minority populations
#   3. women - Women and female-identifying individuals
#   4. lgbtq - LGBTQ+ population
#   5. disabled - Disabled (physical and/or mental) population
#   6. immigrants - Immigrant population

